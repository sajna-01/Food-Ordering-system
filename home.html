<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering - Home</title>
    <!-- Font Awesome for Search Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-container">
        <!-- Header -->
        <header class="header">
            <h1>Home</h1>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" placeholder="Search" class="search-input">
        </div>

        <!-- Section Title -->
        <h2 class="section-title">Popular Searches</h2>

        <!-- Food List Container -->
        <div class="food-list">
            
            <!-- Food Item: Biryani -->
            <div class="food-card">
                <div class="food-img-container">
                    <img src="biryani.png" alt="Chicken Biryani" class="food-img">
                </div>
                <div class="food-details">
                    <h3 class="food-name">Chicken<br>Biryani</h3>
                    <div class="food-meta">
                        <span class="price">Rs. 450</span>
                        <span class="time">40 mins</span>
                    </div>
                </div>
            </div>

            <!-- Food Item: Burger -->
            <div class="food-card">
                <div class="food-img-container">
                    <img src="burger.png" alt="Burger" class="food-img">
                </div>
                <div class="food-details">
                    <h3 class="food-name">Burger</h3>
                    <div class="food-meta">
                        <span class="price">Rs. 650</span>
                        <span class="time">30 mins</span>
                    </div>
                </div>
            </div>

            <!-- Food Item: Pizza -->
            <div class="food-card">
                <div class="food-img-container">
                    <img src="pizza.png" alt="Pizza" class="food-img">
                </div>
                <div class="food-details">
                    <h3 class="food-name">Pizza</h3>
                    <div class="food-meta">
                        <span class="price">Rs. 550</span>
                        <span class="time">25 mins</span>
                    </div>
                </div>
            </div>

            <!-- Food Item: French Fries -->
            <div class="food-card">
                <div class="food-img-container">
                    <img src="fries.png" alt="French Fries" class="food-img">
                </div>
                <div class="food-details">
                    <h3 class="food-name">French<br>fries</h3>
                    <div class="food-meta">
                        <span class="price">Rs.350</span>
                        <span class="time">15 mins</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
