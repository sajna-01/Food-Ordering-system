
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodie - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">

    <style>
        .error-message {
            display: none;
            color: #e53935;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <div class="login-screen">

        <div class="login-visual">
            <div class="visual-content">
                <h2>Delicious Food</h2>
                <p>Fresh . Tasty . Fast</p>

                <img
                    src="images/smallburger.png"
                    alt="Burger"
                    class="visual-emoji burger"
                >
            </div>

            <img
                src="images/momo.png"
                alt="Momo"
                class="visual-emoji-small momo"
            >
        </div>

        <div class="login-form-wrap">

            <h1 class="logo">
                Foodie<span class="heart">♥</span>
            </h1>

            <h2 class="welcome-title">Welcome Back!</h2>

            <p class="welcome-subtitle">Login to continue</p>

            <p id="error-message" class="error-message">
                Invalid email or password!
            </p>

            <form
                class="login-form"
                action="../login.php"
                method="POST"
            >

                <div class="input-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <a href="#" class="forgot-link">
                    Forgot Password?
                </a>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="../register.html">Sign Up</a>
            </p>

        </div>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        if (params.get("error") === "invalid") {
            document.getElementById("error-message").style.display = "block";
        }
    </script>

</body>
</html>
