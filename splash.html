<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Foodie - Delicious food, Delivered fast!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS is inside CSS folder -->
  <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

  <div class="splash-screen">

    <div class="food-illustration">
      <img src="CSS/images/Burger.png" alt="Foodie" class="splash-photo">
      <div class="plate"></div>
    </div>

    <h1 class="logo">
      Foodie<span class="heart">♥</span>
    </h1>

    <p class="tagline">
      Delicious food,<br>
      Delivered fast!
    </p>

    <div class="dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </div>

  <!-- Automatically go to Login after 3 seconds -->
  <script>
    setTimeout(function () {
      window.location.href = "CSS/login.html";
    }, 3000);
  </script>

</body>
</html>
