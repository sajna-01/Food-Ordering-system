<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Food Ordering System</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="overlay">

        <h1>
            Food Of <br>
            Your Choice <br>
            Delivered <br>
            Hot and Fresh
        </h1>

        <form>

            <input type="email"
            placeholder="Email"
            required>

            <input type="password"
            placeholder="Password"
            required>

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">
                Log In
            </button>

        </form>

        <p class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </p>

    </div>

</div>

</body>
</html>
