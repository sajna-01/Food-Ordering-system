<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Bite Special Menu</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <div class="menu-container">
        <!-- Top Section / Header Image & Icon -->
        <div class="menu-header">
            <div class="header-left">
                <h1 class="main-title">Quick Bite<br>Special Menu</h1>
                <img src="top-food.png" alt="Special Dish" class="top-food-img">
            </div>
            <div class="header-right">
                <!-- Icon: Tray serving hand -->
                <img src="serving-icon.png" alt="Serving Icon" class="serving-icon">
            </div>
        </div>

        <!-- Main Menu Box -->
        <div class="menu-box">
            <h2 class="category-title">FOOD</h2>
            
            <div class="menu-list">
                <!-- Single Item -->
                <div class="menu-item">
                    <span class="item-name">Ham and Cheese Sandwich</span>
                    <span class="item-price">550</span>
                </div>

                <!-- Sub-category: Momo -->
                <div class="momo-section">
                    <span class="sub-title">Momo:</span>
                    <div class="menu-item sub-item">
                        <span class="item-name">Veg Momo</span>
                        <span class="item-price">150</span>
                    </div>
                    <div class="menu-item sub-item">
                        <span class="item-name">Chicken Momo</span>
                        <span class="item-price">200</span>
                    </div>
                    <div class="menu-item sub-item">
                        <span class="item-name">Buff Momo</span>
                        <span class="item-price">170</span>
                    </div>
                </div>

                <!-- Single Item with underline style like mockup -->
                <div class="menu-item special-underline">
                    <span class="item-name">Chicken Kurkure</span>
                    <span class="item-price">280</span>
                </div>

                <div class="menu-item">
                    <span class="item-name">Chicken Wings</span>
                    <span class="item-price">350</span>
                </div>

                <div class="menu-item">
                    <span class="item-name">Keima Noodles</span>
                    <span class="item-price">190</span>
                </div>

                <div class="menu-item">
                    <span class="item-name">Pasta</span>
                    <span class="item-price">220</span>
                </div>

                <div class="menu-item">
                    <span class="item-name">Sekuwa</span>
                    <span class="item-price">750</span>
                </div>

                <div class="menu-item">
                    <span class="item-name">Hot Dogs</span>
                    <span class="item-price">500</span>
                </div>

                <div class="menu-item">
                    <span class="item-name">Grilled Chicken</span>
                    <span class="item-price">870</span>
                </div>

                <div class="menu-item">
                    <span class="item-name">Fried Rice</span>
                    <span class="item-price">250</span>
                </div>
            </div>
        </div>

        <!-- Bottom Salad Image -->
        <div class="bottom-image-container">
            <img src="salad.png" alt="Salad" class="bottom-salad-img">
        </div>
    </div>

</body>
</html>
