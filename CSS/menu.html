<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="menu.css">

<div class="menu-item">
<span>Sekuwa</span>
<span>Rs 750</span>
</div>
<div class="menu-item">
<span>Hot Dogs</span>
<span>Rs 500</span>
</div>
<div class="menu-item">
<span>Grilled Chicken</span>

</div>
<div class="menu-item">
<span>Fried Rice</span>
<span>Rs 250</span>
</div>
</div>
</div>
<div class="bottom-image-container">
<img src="images/salad.png" alt="Salad" class="bottom-salad-img">
</div>
</div>

</html>
