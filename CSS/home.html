<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering - Home</title>
    <!-- Font Awesome for Search Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="home.css">
</head>
<body>

<div class="mobile-container">

    <div class="header">
        <h1>Hey, what's cooking?</h1>
    </div>

    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input class="search-input" type="text" placeholder="Search for food or restaurant">
    </div>

    <div class="section-title">Popular Near You</div>

    <div class="food-list">

        <!-- Card 1: Burger -->
        <div class="food-card">
            <div class="food-img-container">
                <img class="food-img" src="https://images.unsplash.com/photo-1556816238-6c9caf68f140?fm=jpg&q=70&w=300&fit=crop&auto=format" alt="Classic Beef Burger">
            </div>
            <div class="food-details">
                <div class="food-name">Classic Beef Burger</div>
            </div>
            <div class="food-meta">
                <div class="price">Rs 300</div>
                <div class="time">20 min</div>
            </div>
        </div>

        <!-- Card 2: Pizza -->
        <div class="food-card">
            <div class="food-img-container">
                <img class="food-img" src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?fm=jpg&q=70&w=300&fit=crop&auto=format" alt="Margherita Pizza">
            </div>
            <div class="food-details">
                <div class="food-name">Margherita Pizza</div>
            </div>
            <div class="food-meta">
                <div class="price">Rs 350</div>
                <div class="time">30 min</div>
            </div>
        </div>

        <!-- Card 3: Salad -->
        <div class="food-card">
            <div class="food-img-container">
                <img class="food-img" src="https://images.unsplash.com/photo-1607532941433-304659e8198a?fm=jpg&q=70&w=300&fit=crop&auto=format" alt="Garden Veggie Salad">
            </div>
            <div class="food-details">
                <div class="food-name">Garden Veggie Salad</div>
            </div>
            <div class="food-meta">
                <div class="price">Rs 250</div>
                <div class="time">15 min</div>
            </div>
        </div>

        <!-- Card 4: Ramen -->
        <div class="food-card">
            <div class="food-img-container">
                <img class="food-img" src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?fm=jpg&q=70&w=300&fit=crop&auto=format" alt="Spicy Ramen Bowl">
            </div>
            <div class="food-details">
                <div class="food-name">Spicy Ramen Bowl</div>
            </div>
            <div class="food-meta">
                <div class="price"> Rs 220</div>
                <div class="time">25 min</div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
