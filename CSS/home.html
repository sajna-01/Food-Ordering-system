<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering - Home</title>

    <link rel="stylesheet" href="home.css">
</head>

<body>

<div class="mobile-container">

    <div class="header">
        <h1>Hey, what's cooking?</h1>
    </div>


    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input class="search-input" 
        type="text" 
        placeholder="Search for food or restaurant">
    </div>


    <h2 class="section-title">
        Popular Near You
    </h2>


    <div class="food-list">


        <div class="food-card">

            <div class="food-img-container">
                <img class="food-img" src="images/burger.jpg" alt="Burger">
            </div>

            <div class="food-details">
                <div class="food-name">
                    Classic Beef Burger
                </div>

                <div class="price">
                    Rs 300
                </div>

                <div class="time">
                    20 min
                </div>
            </div>

        </div>



        <div class="food-card">

            <div class="food-img-container">
                <img class="food-img" src="images/pizza.jpg" alt="Pizza">
            </div>

            <div class="food-details">
                <div class="food-name">
                    Margherita Pizza
                </div>

                <div class="price">
                    Rs 350
                </div>

                <div class="time">
                    30 min
                </div>
            </div>

        </div>



        <div class="food-card">

            <div class="food-img-container">
                <img class="food-img" src="images/salad.jpg" alt="Salad">
            </div>

            <div class="food-details">
                <div class="food-name">
                    Garden Veggie Salad
                </div>

                <div class="price">
                    Rs 250
                </div>

                <div class="time">
                    15 min
                </div>
            </div>

        </div>



        <div class="food-card">

            <div class="food-img-container">
                <img class="food-img" src="images/ramen.jpg" alt="Ramen">
            </div>

            <div class="food-details">
                <div class="food-name">
                    Spicy Ramen Bowl
                </div>

                <div class="price">
                    Rs 220
                </div>

                <div class="time">
                    25 min
                </div>
            </div>

        </div>


    </div>

</div>


</body>
</html>
